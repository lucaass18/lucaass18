name: Atualizar troféus

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - assets/trofeus-cores.sed
      - .github/workflows/trofeus.yml

permissions:
  contents: write

jobs:
  trofeus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e recolorir troféus
        run: |
          URL="https://github-trophies.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&no-bg=true&title=Commits,Repositories,NewUser,LongTimeUser&row=1&column=4&margin-w=15"
          curl -fsSL "$URL" -o /tmp/trofeus.svg
          grep -q "<svg" /tmp/trofeus.svg
          sed -f assets/trofeus-cores.sed /tmp/trofeus.svg > assets/trofeus.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trofeus.svg
          git diff --cached --quiet || git commit -m "Atualiza troféus"
          git push
